services:
  - type: web
    name: novaarc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novaarc-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_URL
        value: https://novaarc.netlify.app
      - key: OPENROUTER_API_KEY
        value: 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

databases:
  - name: novaarc-postgres
    plan: free
    databaseName: novaarc
    user: novaarc_user
    region: oregon
