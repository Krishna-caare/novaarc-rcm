name: Deploy Backend to Render

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY || 'rnd_aP3IkpQlJgFgw1J0QIdxIFoQbUAo' }}
        run: |
          curl -f -X POST "https://api.render.com/v1/services/srv-dakdusnqj5pc73ar1l7g/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json"
      - name: Confirm deployment
        run: echo "✅ Backend deployment triggered on Render successfully"
